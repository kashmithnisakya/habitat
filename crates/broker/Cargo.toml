[package]
name = "habitat-broker"
description = "Policy engine, secrets vault, gateway and audit log for Habitat"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
habitat-core = { version = "0.0.0", path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
toml = "1.1.8"
# Exact, because the parts that let this control name lookups have no stability promise.
ureq = { version = "=3.5.1", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3.27.0"
