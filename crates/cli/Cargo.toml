[package]
name = "habitat-cli"
description = "Command line for Habitat"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "habitat"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
ctrlc = { version = "3", features = ["termination"] }
habitat-broker = { version = "0.0.0", path = "../broker" }
habitat-backend-wasm = { version = "0.0.0", path = "../backend-wasm" }
habitat-core = { version = "0.0.0", path = "../core" }

[dev-dependencies]
tempfile = "3.27.0"
wat = "1.263.0"
wit-component = "0.263.0"
