[package]
name = "habitat-backend-wasm"
description = "Wasmtime backend for running Habitat agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
getrandom = "0.4.3"
habitat-core = { version = "0.0.0", path = "../core" }
wasmtime = { version = "=50.0.1", default-features = false, features = ["component-model", "cranelift", "reexport-wasmparser", "runtime", "std"] }

[dev-dependencies]
tempfile = "3.27.0"
wasm-encoder = "0.263.0"
wat = "1.263.0"
wit-component = "0.263.0"
wit-parser = "0.263.0"

[[test]]
name = "compile_cost_attacks"
path = "../../tests/attacks/compile_cost.rs"
