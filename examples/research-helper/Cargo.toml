[package]
name = "habitat-research-helper"
description = "An agent that looks something up, asks a model about it and keeps notes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
habitat-sdk = { path = "../../crates/sdk" }
serde = { version = "1.0.229", features = ["derive"] }
