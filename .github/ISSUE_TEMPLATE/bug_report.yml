name: Bug report
description: Something doesn't work as expected. Report security problems privately instead.
labels: ["type: bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: macOS 15 on M2, or Android 16 on Pixel 8
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove any secrets or personal data first.
      render: text
