name: Feature request
description: Suggest a new capability or improvement.
labels: ["type: feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security impact
      description: Does this give agents new access, or change what the broker checks?
