name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  flutter:
    name: Flutter app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build: flutter build apk --debug
          - os: macos-latest
            build: flutter build ios --debug --no-codesign
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, wasm32-unknown-unknown
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - run: ${{ matrix.build }}

  wit:
    name: Validate agent API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools
      - run: wasm-tools component wit wit/
      - name: Build an agent against the API
        run: |
          cargo build -p habitat-api-check --target wasm32-unknown-unknown --release
          wasm-tools component new target/wasm32-unknown-unknown/release/habitat_api_check.wasm -o api-check.wasm
      - name: Check that the agent imports only the API
        run: |
          imports=$(wasm-tools component wit api-check.wasm | grep -E '^\s*import ')
          echo "$imports"
          echo "$imports" | grep -q 'habitat:host/agent-home@'
          if echo "$imports" | grep -v 'habitat:host/'; then
            echo "The agent imports something other than the agent API"
            exit 1
          fi
