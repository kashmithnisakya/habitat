name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Every test program, so that one failure doesn't hide the others.
      - run: cargo test --workspace --no-fail-fast
      # Linux runners have no keystore to test with, and it's only safe to add to one here.
      - name: Test with the real keystore
        if: runner.os != 'Linux'
        timeout-minutes: 10
        run: cargo test -p habitat-broker -p habitat-cli real_keystore -- --ignored

  wit:
    name: Validate agent API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools
      - run: wasm-tools component wit wit/
      - name: Build an agent against the API
        run: |
          cargo build -p habitat-api-check --target wasm32-unknown-unknown --release
          wasm-tools component new target/wasm32-unknown-unknown/release/habitat_api_check.wasm -o api-check.wasm
      - name: Build the research helper
        run: |
          cargo build -p habitat-research-helper --target wasm32-unknown-unknown --release
          wasm-tools component new target/wasm32-unknown-unknown/release/habitat_research_helper.wasm -o research-helper.wasm
          if wasm-tools component wit research-helper.wasm | grep -E '^\s*import ' | grep -v 'habitat:host/'; then
            echo "The research helper imports something other than the agent API"
            exit 1
          fi
      - name: Check that the agent imports only the API
        run: |
          imports=$(wasm-tools component wit api-check.wasm | grep -E '^\s*import ')
          echo "$imports"
          echo "$imports" | grep -q 'habitat:host/agent-home@'
          if echo "$imports" | grep -v 'habitat:host/'; then
            echo "The agent imports something other than the agent API"
            exit 1
          fi
      # The same steps as "Getting started" in the README, so that they keep working.
      - name: Follow the getting started steps
        env:
          HABITAT_HOME: ${{ runner.temp }}/habitat
        run: |
          cargo build --release -p habitat-cli
          cargo build --release -p habitat-hello --target wasm32-unknown-unknown
          wasm-tools component new target/wasm32-unknown-unknown/release/habitat_hello.wasm -o hello.wasm
          target/release/habitat pack examples/hello/agent.toml hello.wasm -o hello.habitat
          target/release/habitat install hello.habitat
          target/release/habitat run hello "Ada"
          target/release/habitat run hello "Grace"
          target/release/habitat list
          grep -q '"count":2' "$HABITAT_HOME/agents/hello/home/state/visits.json"
          imports=$(wasm-tools component wit hello.wasm | grep -E '^\s*import ')
          echo "$imports"
          if echo "$imports" | grep -v 'habitat:host/'; then
            echo "The hello agent imports something other than the agent API"
            exit 1
          fi
          target/release/habitat remove hello --yes
